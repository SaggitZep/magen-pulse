<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111e">
<meta name="description" content="Magen Pulse — הערכת מצב מבוססת מידע גלוי">
<title>Magen Pulse</title>
<style>
:root{
  color-scheme:dark;
  --bg:#07111e;--panel:#0d1928;--panel2:#101f31;--line:#22354d;
  --text:#f4f7fb;--muted:#91a1b5;--soft:#c7d1dd;--accent:#62a8ff;
  --green:#43c984;--yellow:#e5bd58;--orange:#ec8b4a;--red:#e85b67;--violet:#9a79ec;
  --radius:17px;--shadow:0 16px 44px rgba(0,0,0,.22)
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif}
body{background:radial-gradient(circle at 50% -20%,#173454 0,transparent 40%),var(--bg);overflow:hidden}
button{font:inherit}
.app{width:min(1180px,100%);height:100svh;margin:auto;padding:max(9px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-rows:38px minmax(0,1fr) 20px;gap:8px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;direction:ltr;min-width:0}.brand strong{font-size:1.15rem;letter-spacing:.02em}.brand span{direction:rtl;color:var(--muted);font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px}.health{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.68rem;white-space:nowrap}.health-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.icon-btn{width:31px;height:31px;border:1px solid var(--line);border-radius:50%;background:rgba(13,25,40,.88);color:var(--soft);cursor:pointer}
.dashboard{min-height:0;display:grid;grid-template-columns:1.08fr .92fr;grid-template-rows:minmax(0,.88fr) minmax(0,.72fr) minmax(0,1fr);gap:8px}
.card{background:linear-gradient(180deg,rgba(16,31,49,.97),rgba(11,23,37,.97));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0;min-height:0;overflow:hidden}
.assessment{grid-row:1 / 4;padding:15px;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:8px}
.assessment-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.eyebrow{font-size:.68rem;color:var(--muted);font-weight:650}.updated{font-size:.68rem;color:var(--muted);white-space:nowrap}
.gauge-wrap{display:grid;place-items:center;position:relative;min-height:0}.gauge{width:min(335px,84%);height:auto;overflow:visible}.gauge-track{fill:none;stroke:#1c2d42;stroke-width:18;stroke-linecap:round}.gauge-value{fill:none;stroke:var(--green);stroke-width:18;stroke-linecap:round;stroke-dasharray:0 100;filter:drop-shadow(0 0 7px rgba(67,201,132,.25));transition:stroke-dasharray .65s ease,stroke .35s ease}.gauge-center{position:absolute;inset:45% 0 auto;text-align:center;transform:translateY(-50%)}
.main-score{font-size:clamp(3.4rem,7vw,5.9rem);font-weight:800;letter-spacing:-.06em;line-height:.86;direction:ltr}.score-unit{font-size:.7rem;color:var(--muted);margin-top:8px}.main-status{font-size:.9rem;color:var(--soft);margin-top:5px}.trend-line{font-size:.7rem;color:var(--muted);margin-top:4px}
.horizons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.horizon{border:1px solid var(--line);background:rgba(7,17,30,.35);border-radius:12px;padding:8px 6px;text-align:center;cursor:pointer;color:inherit}.horizon.active{border-color:#365c87;background:#102743}.horizon span{display:block;color:var(--muted);font-size:.64rem}.horizon b{display:block;font-size:1.16rem;margin-top:3px;direction:ltr}.horizon em{display:block;font-style:normal;font-size:.58rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.confidence-row{display:flex;align-items:center;gap:9px}.confidence-row span{font-size:.67rem;color:var(--muted);white-space:nowrap}.confidence-track{height:5px;background:#1b2c41;border-radius:999px;overflow:hidden;flex:1}.confidence-fill{height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .55s ease}.confidence-row b{font-size:.7rem;direction:ltr}
.context{padding:12px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:6px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-title{font-size:.78rem;font-weight:750}.text-btn{border:0;background:none;color:var(--muted);font-size:.64rem;cursor:pointer;padding:2px}.summary{font-size:.72rem;line-height:1.4;color:var(--soft);margin:0;min-height:2em}.drivers{display:grid;gap:4px;align-content:start}.driver{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:6px;align-items:center;padding:5px 7px;border-radius:9px;background:rgba(7,17,30,.38);min-width:0;cursor:pointer}.driver-arrow{font-size:.66rem}.driver.up .driver-arrow{color:var(--orange)}.driver.down .driver-arrow{color:var(--green)}.driver-text{font-size:.64rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.driver-meta{font-size:.56rem;color:var(--muted);direction:ltr;white-space:nowrap}
.trend{padding:12px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:5px}.trend-head{display:flex;align-items:center;justify-content:space-between}.legend{display:flex;gap:7px;color:var(--muted);font-size:.56rem}.legend i{display:inline-block;width:9px;height:2px;border-radius:9px;margin-left:2px;vertical-align:middle}.chart{min-height:0;position:relative}.chart svg{width:100%;height:100%;display:block}
.pulse{padding:12px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}.pulse-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:6px;min-height:0}.pulse-card{border:1px solid var(--line);background:rgba(7,17,30,.42);border-radius:11px;padding:6px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0;cursor:pointer;color:inherit;text-align:right}.pulse-top{display:flex;align-items:center;justify-content:space-between;gap:4px}.pulse-icon{font-size:.9rem}.pulse-info{display:grid;place-items:center;width:15px;height:15px;border:1px solid #38506b;border-radius:50%;font-size:.52rem;color:#a9bad0;font-style:normal}.pulse-name{font-size:.59rem;line-height:1.16;align-self:center}.pulse-bottom{display:flex;align-items:end;justify-content:space-between;gap:5px}.pulse-score{font-size:1rem;font-weight:760;direction:ltr}.pulse-state{font-size:.49rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-ring{width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--ring) calc(var(--value)*1%),#1a2b40 0);position:relative;flex:0 0 auto}.mini-ring:after{content:"";position:absolute;inset:3px;background:#0b1725;border-radius:50%}
.footer{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.59rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overlay{position:fixed;inset:0;background:rgba(2,7,14,.72);backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:10px;z-index:20}.overlay.open{display:flex}.sheet{width:min(650px,100%);max-height:min(84svh,740px);overflow:auto;background:#0c1928;border:1px solid var(--line);border-radius:20px;padding:17px}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.sheet h2{font-size:1rem;margin:0}.close{border:0;background:none;color:var(--text);font-size:1.45rem;cursor:pointer}.sheet-body{font-size:.75rem;line-height:1.6;color:var(--soft)}.sheet-body h3{font-size:.76rem;color:var(--text);margin:15px 0 4px}.sheet-body a{color:#8cbfff}.source-row{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.67rem;padding:10px}
@media(max-width:760px){
  .app{padding:6px 7px max(5px,env(safe-area-inset-bottom));grid-template-rows:33px minmax(0,1fr) 16px;gap:5px}.brand strong{font-size:1rem}.brand span{display:none}.icon-btn{width:28px;height:28px}.health{font-size:.58rem}
  .dashboard{grid-template-columns:1fr;grid-template-rows:minmax(0,1.42fr) minmax(0,.62fr) minmax(0,.48fr) minmax(0,.82fr);gap:5px}.assessment{grid-row:auto;padding:8px;grid-template-rows:auto minmax(0,1fr) auto auto;gap:4px}.context,.trend,.pulse{padding:7px;gap:3px}
  .gauge{width:min(225px,68%)}.gauge-track,.gauge-value{stroke-width:15}.gauge-center{inset:46% 0 auto}.main-score{font-size:3rem}.score-unit{font-size:.51rem;margin-top:3px}.main-status{font-size:.68rem;margin-top:2px}.trend-line{font-size:.55rem;margin-top:1px}.updated,.eyebrow{font-size:.55rem}
  .horizon{padding:4px 3px;border-radius:9px}.horizon span{font-size:.52rem}.horizon b{font-size:.91rem;margin-top:1px}.horizon em{font-size:.46rem;margin-top:1px}.confidence-row span,.confidence-row b{font-size:.53rem}.confidence-track{height:4px}
  .section-title{font-size:.62rem}.text-btn{font-size:.52rem}.summary{font-size:.57rem;line-height:1.28;min-height:0}.drivers{grid-template-columns:1fr 1fr;gap:3px}.driver{padding:3px 5px;grid-template-columns:11px minmax(0,1fr)}.driver:nth-child(n+3){display:none}.driver-text{font-size:.52rem}.driver-meta{display:none}.driver-arrow{font-size:.55rem}
  .legend{font-size:.45rem;gap:4px}.legend i{width:7px}.pulse-grid{gap:3px}.pulse-card{padding:4px;border-radius:8px}.pulse-name{font-size:.48rem}.pulse-score{font-size:.78rem}.pulse-icon{font-size:.68rem}.pulse-info{width:12px;height:12px;font-size:.4rem}.pulse-state{font-size:.4rem}.mini-ring{width:14px;height:14px}.mini-ring:after{inset:2.5px}.footer{font-size:.48rem}
  .overlay{align-items:flex-end}.sheet{border-radius:19px 19px 10px 10px;max-height:82svh}
}
@media(max-width:380px), (max-height:650px){
  .main-score{font-size:2.65rem}.gauge{width:min(200px,62%)}.horizon em{display:none}.summary{font-size:.53rem}.pulse-name{font-size:.44rem}.pulse-state{display:none}
}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><strong>Magen Pulse</strong><span>הערכת מצב מבוססת מידע גלוי</span></div>
    <div class="top-actions"><div class="health"><span class="health-dot" id="healthDot"></span><span id="healthText">מאתחל</span></div><button class="icon-btn" id="openAbout" aria-label="מידע על המערכת">i</button></div>
  </header>

  <section class="dashboard">
    <article class="card assessment">
      <div class="assessment-head"><span class="eyebrow">מדד סיכון לתקיפה ישירה על ישראל</span><span class="updated" id="updated">עודכן: —</span></div>
      <div class="gauge-wrap">
        <svg class="gauge" viewBox="0 0 240 145" aria-hidden="true"><path class="gauge-track" pathLength="100" d="M28 124 A92 92 0 0 1 212 124"/><path class="gauge-value" id="gaugeValue" pathLength="100" d="M28 124 A92 92 0 0 1 212 124"/></svg>
        <div class="gauge-center"><div class="main-score" id="mainScore">—</div><div class="score-unit">מתוך 100</div><div class="main-status" id="mainStatus">ממתין לנתונים</div><div class="trend-line" id="trendLine">—</div></div>
      </div>
      <div class="horizons" id="horizons"></div>
      <div class="confidence-row"><span>רמת ביטחון בחישוב</span><div class="confidence-track"><div class="confidence-fill" id="confidenceFill"></div></div><b id="confidenceValue">—</b></div>
    </article>

    <article class="card context">
      <div class="section-head"><span class="section-title">מה השתנה?</span><button class="text-btn" id="openDrivers">פירוט</button></div>
      <p class="summary" id="summary">המערכת ממתינה לאיסוף הנתונים הראשון.</p>
      <div class="drivers" id="drivers"></div>
    </article>

    <article class="card trend">
      <div class="trend-head"><span class="section-title">מגמה</span><div class="legend"><span><i style="background:#6faeff"></i>60 דק׳</span><span><i style="background:#e5bd58"></i>6 ש׳</span><span><i style="background:#9a79ec"></i>24 ש׳</span></div></div>
      <div class="chart"><svg id="chart" viewBox="0 0 560 155" preserveAspectRatio="none"></svg></div>
    </article>

    <article class="card pulse">
      <div class="section-head"><span class="section-title">מדדי מצב</span><span class="eyebrow" id="coverage">כיסוי: —</span></div>
      <div class="pulse-grid" id="pulseGrid"></div>
    </article>
  </section>
  <footer class="footer">אינו התרעה רשמית ואינו תחליף להנחיות פיקוד העורף.</footer>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="sheet"><div class="sheet-head"><h2 id="sheetTitle">פירוט</h2><button class="close" id="closeSheet" aria-label="סגירה">×</button></div><div class="sheet-body" id="sheetBody"></div></div></div>
<script src="data/state.js"></script>
<script>
const OFFLINE={mode:'offline',generated_at:null,assessment:{immediate:{label:'60 דקות',score:null,confidence:0,status:'אין נתונים'},short:{label:'6 שעות',score:null,confidence:0,status:'אין נתונים'},extended:{label:'24 שעות',score:null,confidence:0,status:'אין נתונים'}},coverage:{percent:0,available:0,expected:0},velocity:{level:'לא זמין',points_60m:0},changes:[],signals:[],history:[],health:{pipeline:'offline',message:'לא ניתן לטעון את קובץ הנתונים.'},methodology:{formula:''}};
const PULSE_DEFS=[
 {id:'military',name:'פעילות צבאית איראנית',icon:'◉',cats:['capability'],explain:'פריסה, משגרים, תרגילים או היערכות צבאית שדווחו במקורות הפומביים.'},
 {id:'readiness',name:'היערכות אזרחית',icon:'✚',cats:['israel_readiness'],terms:['hospital','shelter','school','בתי חולים','מקלטים','לימודים'],explain:'שינויים בהיערכות מוסדות אזרחיים, בתי חולים, לימודים ומקלטים.'},
 {id:'defense',name:'פיקוד העורף',icon:'⬡',cats:['israel_readiness'],terms:['home front','פיקוד העורף'],explain:'הנחיות או שינויי מדיניות שפורסמו בנוגע להתגוננות האזרחית.'},
 {id:'aviation',name:'תעופה',icon:'✈',terms:['airspace','aviation','flight','notam','מרחב אווירי','טיס'],explain:'סגירת מרחב אווירי, NOTAM, ביטולי טיסות או מגבלות תעופה.'},
 {id:'maritime',name:'ספנות',icon:'≋',terms:['ship','naval','maritime','port','red sea','ספנות','נמל','ים סוף'],explain:'אירועים ימיים, ספנות, נמלים ונתיבי סחר שעשויים להעיד על הסלמה אזורית.'},
 {id:'infra',name:'תקשורת וניווט',icon:'⌁',terms:['gps','communication','internet','jamming','תקשורת','שיבוש'],explain:'שיבושי GPS, תקשורת או אינטרנט שדווחו במידע הגלוי.'},
 {id:'regional',name:'פעילות אזורית',icon:'◎',cats:['regional_escalation'],explain:'תקיפות, יירוטים או תנועות בזירות אזוריות הקשורות לעימות.'},
 {id:'strategic',name:'איתותים אסטרטגיים',icon:'▤',cats:['direct_intent'],explain:'איומים ישירים, הצהרות נקמה, דיווחי שיגור או סימנים לכוונה לפעול נגד ישראל.'}
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const riskColor=v=>v==null?'#91a1b5':v<8?'#43c984':v<22?'#74c98d':v<42?'#e5bd58':v<62?'#ec8b4a':v<82?'#e85b67':'#9a79ec';
const stateLabel=v=>v==null?'אין נתונים':v<8?'לא זוהה אות':v<22?'נמוך':v<42?'מוגבר':v<62?'משמעותי':v<82?'גבוה':'קריטי';
const fmtTime=t=>t?new Date(t).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jerusalem'}):'—';
let DATA=window.MAGEN_STATE||OFFLINE,activeHorizon='immediate';
function signalMatches(s,d){const txt=((s.name||'')+' '+(s.finding||'')).toLowerCase();return (d.cats||[]).includes(s.category)||(d.terms||[]).some(t=>txt.includes(t));}
function pulseData(d){const loaded=d.mode!=='offline';return PULSE_DEFS.map(def=>{const items=(d.signals||[]).filter(s=>signalMatches(s,def)&&s.active!==false);if(!items.length)return {...def,score:loaded?0:null,confidence:loaded?Math.round((d.assessment?.[activeHorizon]?.confidence||0)*.65):0,items:[]};const vals=items.map(s=>Math.max(0,Number(s.computed?.[activeHorizon]||0))).filter(v=>v>0);const score=vals.length?Math.min(100,Math.round(100*(1-vals.reduce((r,v)=>r*(1-Math.min(.92,v/100)),1)))):0;const confidence=Math.round(items.reduce((a,s)=>a+((s.reliability||0)*(s.freshness||0)),0)/items.length*100);return {...def,score,confidence,items:items.sort((a,b)=>Math.abs(b.computed?.[activeHorizon]||0)-Math.abs(a.computed?.[activeHorizon]||0))};});}
function summaryText(d){const a=d.assessment?.[activeHorizon];if(a?.score==null)return d.health?.message||'אין די נתונים להצגת הערכה.';const delta=Number(d.velocity?.points_60m||0);const movement=delta>1?'נרשמה עלייה מאז העדכון הקודם.':delta<-1?'נרשמה ירידה מאז העדכון הקודם.':'לא נרשם שינוי מהותי מאז העדכון הקודם.';return `${movement} המדד לחלון של ${a.label} הוא ${a.score}/100, ברמת ${a.status}.`;}
function render(d){DATA=d;const a=d.assessment?.[activeHorizon]||{};const score=a.score;
 $('mainScore').textContent=score==null?'—':score;$('mainStatus').textContent=a.status||'אין נתונים';$('updated').textContent='עודכן: '+fmtTime(d.generated_at);$('gaugeValue').style.stroke=riskColor(score);$('gaugeValue').style.strokeDasharray=`${score??0} 100`;
 const delta=Number(d.velocity?.points_60m||0);$('trendLine').textContent=delta>1?`בעלייה · ‎+${delta} נק׳`:delta<-1?`בירידה · ${delta} נק׳`:'יציב';
 $('horizons').innerHTML=['immediate','short','extended'].map(k=>{const x=d.assessment?.[k]||{};return `<button class="horizon ${k===activeHorizon?'active':''}" data-h="${k}"><span>${esc(x.label||'—')}</span><b style="color:${riskColor(x.score)}">${x.score==null?'—':x.score}</b><em>${esc(x.status||'')}</em></button>`}).join('');document.querySelectorAll('.horizon').forEach(b=>b.onclick=()=>{activeHorizon=b.dataset.h;render(DATA)});
 const conf=Number(a.confidence||0);$('confidenceFill').style.width=conf+'%';$('confidenceValue').textContent=conf?conf+'%':'—';$('coverage').textContent=`כיסוי: ${d.coverage?.available??0}/${d.coverage?.expected??0}`;$('summary').textContent=summaryText(d);
 const changes=(d.changes||[]).slice(0,4);$('drivers').innerHTML=changes.length?changes.map(x=>`<div class="driver ${x.direction==='down'?'down':'up'}" data-signal="${esc(x.signal_id||'')}"><span class="driver-arrow">${x.direction==='down'?'▼':'▲'}</span><span class="driver-text">${esc(x.text)}</span><span class="driver-meta">${esc(x.time||'')} · i</span></div>`).join(''):'<div class="empty">לא נמצא שינוי משמעותי באיסוף האחרון.</div>';document.querySelectorAll('[data-signal]').forEach(row=>row.onclick=()=>openSignal((d.signals||[]).find(s=>s.id===row.dataset.signal)));
 const pulses=pulseData(d);$('pulseGrid').innerHTML=pulses.map(p=>`<button class="pulse-card" data-pulse="${p.id}" aria-label="מידע על ${esc(p.name)}"><span class="pulse-top"><span class="pulse-icon">${p.icon}</span><i class="pulse-info">i</i></span><span class="pulse-name">${p.name}</span><span class="pulse-bottom"><span><b class="pulse-score" style="color:${riskColor(p.score)}">${p.score==null?'—':p.score}</b><span class="pulse-state">${stateLabel(p.score)}</span></span><span class="mini-ring" style="--value:${p.score??0};--ring:${riskColor(p.score)}"></span></span></button>`).join('');document.querySelectorAll('[data-pulse]').forEach(b=>b.onclick=()=>openPulse(pulses.find(p=>p.id===b.dataset.pulse)));
 draw(d.history||[]);renderHealth(d);
}
function renderHealth(d){const ok=d.mode==='live',offline=d.mode==='offline';$('healthText').textContent=ok?'המערכת פעילה':offline?'לא מחובר':'כיסוי חלקי';$('healthDot').style.background=ok?'#43c984':offline?'#91a1b5':'#e5bd58';}
function draw(history){const svg=$('chart');if(history.length<2){svg.innerHTML='<text x="280" y="80" fill="#91a1b5" text-anchor="middle" font-size="13">המגמה תופיע לאחר שני עדכונים</text>';return}const data=history.slice(-48),W=560,H=155,m={l:24,r:8,t:8,b:16},w=W-m.l-m.r,hh=H-m.t-m.b,x=i=>m.l+i*w/(data.length-1),y=v=>m.t+hh-(Number(v)||0)/100*hh;let out='';[0,25,50,75,100].forEach(v=>out+=`<line x1="${m.l}" y1="${y(v)}" x2="${W-m.r}" y2="${y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${m.l-5}" y="${y(v)+3}" fill="#718399" font-size="8" text-anchor="end">${v}</text>`);[['immediate','#6faeff',3],['short','#e5bd58',2],['extended','#9a79ec',2]].forEach(([k,c,sw])=>{const pts=data.map((p,i)=>`${x(i)},${y(p[k])}`).join(' ');out+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>`});svg.innerHTML=out;}
function openSheet(title,html){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=html;$('overlay').classList.add('open');}
function sourceHtml(s){return `<div class="source-row"><b>${esc(s.name)}</b><br><span>${esc(s.finding||'')}<br>${esc(s.source||'מקור פומבי')} · השפעה ${Number(s.computed?.[activeHorizon]||0).toFixed(1)}</span>${s.url?`<br><a href="${esc(s.url)}" target="_blank" rel="noopener">פתיחת המקור</a>`:''}</div>`;}
function openSignal(s){if(!s)return;openSheet('פירוט האות',sourceHtml(s));}
function openPulse(p){const sources=p.items.slice(0,8).map(sourceHtml).join('');openSheet(p.name,`<p>${esc(p.explain)}</p><p><b>מצב:</b> ${stateLabel(p.score)}${p.score!=null?` · ${p.score}/100`:''}</p><p><b>רמת ביטחון בקטגוריה:</b> ${p.confidence?p.confidence+'%':'אין די נתונים'}</p><p>${p.items.length?'הציון מבוסס על האינדיקציות הפעילות שמופיעות להלן.':'לא נמצאה אינדיקציה רלוונטית באיסוף האחרון. הדבר אינו אישור שאין פעילות, אלא תיאור של המידע הגלוי שנקלט.'}</p>${sources?'<h3>אינדיקציות פעילות</h3>'+sources:''}`);}
$('openDrivers').onclick=()=>openSheet('מה השתנה?',(DATA.changes||[]).map(x=>{const s=(DATA.signals||[]).find(y=>y.id===x.signal_id);return s?sourceHtml(s):`<div class="source-row"><b>${esc(x.text)}</b><br><span>${esc(x.impact||'')}</span></div>`}).join('')||'<p>לא נמצא שינוי משמעותי באיסוף האחרון.</p>');
$('openAbout').onclick=()=>openSheet('על Magen Pulse',`<p>Magen Pulse אוסף ומסנן מידע פומבי ומציג מדד מצב בשלושה חלונות זמן.</p><h3>מתודולוגיה</h3><p>${esc(DATA.methodology?.formula||'')}</p><p>${esc(DATA.methodology?.launch_rule||'')}</p><p>המספר הוא מדד חישובי בין 0 ל־100, לא הסתברות סטטיסטית מוכחת. המערכת אינה התרעה רשמית ואינה מחליפה את הנחיות פיקוד העורף.</p><h3>מצב האיסוף</h3><p>${esc(DATA.health?.message||'')}</p>`);
$('closeSheet').onclick=()=>$('overlay').classList.remove('open');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('overlay').classList.remove('open')});
render(DATA);
fetch('data/state.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(render).catch(()=>{});
</script>
